exec-once = dbus-update-activation-environment --all
exec-once = hyprpm reload --notify-fail
exec-once = $HOME/.config/hypr/extra/pipewire.sh
# exec-once = $HOME/.config/hypr/extra/xdph.sh
exec-once = brightnessctl set 50%
exec-once = hyprctl dispatch workspace 1
exec-once = hyprpaper
exec-once = waybar
exec-once = [workspace 1 silent] zen-bin
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = rm -f $HOME/.screenshotLock
exec-once = swaync
exec-once = otd-daemon
exec-once = fcitx5 -d --replace
